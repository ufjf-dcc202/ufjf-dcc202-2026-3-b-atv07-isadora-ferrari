<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutidos</title>
    <style>
        *{
            color:rgb(11, 11, 11);
        }
        code{
            color: lime;
            text-decoration: underline;
            font-family: sans-serif;
        }
        dt > code{
            background-color:rgb(9, 9, 9) ;
            color: white;
        }
       
    </style>
</head>
<body>
    <main>
        <h1>DCC 202 Embutidos</h1>
        <p>Voce pode aplicar um estilo<em style="color:orange"></em>
        para um elemento usando <code>style</code>no <code>head</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <p>Cor texto do elemento</p>
                <p> back</p>
            </div>

            <div>
                <dt><code>background-color</code></dt>
            </div>
        </dl>
    </main>
    
</body>
</html>
